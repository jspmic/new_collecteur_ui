name: new_collecteur_ui
description: "The soft's collector app"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 2.0.0+1

environment:
  sdk: ^3.8.1
dependencies:
  flutter:
    sdk: flutter
  fluent_ui: ^4.12.0
  window_manager: ^0.6.0
  flutter_dotenv: ^6.0.1
  http: ^1.4.0
  crypto: ^3.0.6
  file_picker: ^13.3.2
  syncfusion_flutter_xlsio: ^35.1.43
  intl: ^0.20.2
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon/

flutter_launcher_icons:
  windows:
    generate: true
    image_path: "assets/icon/drawer2.png"
    icon_size: 48 # min:48, max:256, default: 48
